ShortDescription: A free, open-source reference manager with PDF notes and a live citation graph.
Description: |-
  Paperlines keeps your papers, your notes and a live map of how they cite each other in one app on your own computer.
  Collect papers from PDFs, DOIs, arXiv, BibTeX, RIS or Zotero; highlight PDFs and write linked Markdown notes with LaTeX;
  see which papers cite which, mark the key papers of a project, and find what to read next.
  No account, no cloud, no tracking.
