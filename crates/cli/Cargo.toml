[package]
name = "paperlines-cli"
version.workspace = true
edition.workspace = true
description = "Command-line access to the reference library"
license.workspace = true

[[bin]]
name = "paperlines"
path = "src/main.rs"

[dependencies]
paperlines-core = { path = "../core" }
paperlines-ops = { path = "../ops" }
paperlines-mcp = { path = "../mcp" }
clap = { version = "4.6.8", features = ["derive"] }
serde_json = "1.0.154"
paperlines-import = { version = "0.1.2", path = "../import" }

[dev-dependencies]
tempfile = "3.27.0"
