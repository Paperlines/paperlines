name: Smoke test

# Actions → Smoke test → Run workflow: installs a published release on a real Windows machine,
# starts it, reports whether the window has a system menu bar or title bar, and saves a
# screenshot (in the run's artifacts).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release to test, e.g. 0.1.1"
        required: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Install the release (setup .exe, silent)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\release"
          gh release download "v$env:VERSION" --pattern "*_x64-setup.exe" --dir $dir
          $setup = Get-ChildItem $dir -Filter "*_x64-setup.exe" | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList "/S"
          $exe = Get-ChildItem $env:LOCALAPPDATA -Recurse -Depth 3 -Filter "paperlines-app.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "paperlines-app.exe was not installed" }
          "installed: $($exe.FullName)"
          "APP=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Start it and inspect the window
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class W {
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string c, string t);
            [DllImport("user32.dll")] public static extern IntPtr GetMenu(IntPtr h);
            [DllImport("user32.dll")] public static extern int GetWindowLong(IntPtr h, int i);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          "@
          $p = Start-Process -FilePath $env:APP -PassThru
          $hwnd = [IntPtr]::Zero
          for ($i = 0; $i -lt 60 -and $hwnd -eq [IntPtr]::Zero; $i++) {
            Start-Sleep -Seconds 1
            $hwnd = [W]::FindWindow($null, "Paperlines")
          }
          if ($hwnd -eq [IntPtr]::Zero) { throw "no Paperlines window after 60 s" }
          Start-Sleep -Seconds 10
          [W]::SetForegroundWindow($hwnd) | Out-Null
          $style = [W]::GetWindowLong($hwnd, -16)
          $menu = [W]::GetMenu($hwnd) -ne [IntPtr]::Zero
          $caption = ($style -band 0x00C00000) -eq 0x00C00000
          "menu bar:  $menu"
          "title bar: $caption"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($img).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $img.Save("$env:RUNNER_TEMP\paperlines-windows.png")
          Stop-Process -Id $p.Id -Force
          if ($menu -or $caption) {
            "::error::Paperlines $env:VERSION on Windows still has a system menu bar ($menu) or title bar ($caption)"
            exit 1
          }

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshot-windows-${{ inputs.version }}
          path: ${{ runner.temp }}/paperlines-windows.png
          if-no-files-found: ignore
