name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon is cross-compiled on the Intel image: GitHub's arm64 macOS runners are
          # often out of capacity and the job is then cancelled without running
          - { os: macos-15-intel, name: macos-arm64, target: aarch64-apple-darwin }
          # macos-13 is retired; macos-15-intel is GitHub's x86_64 macOS image
          - { os: macos-15-intel, name: macos-x64 }
          # Ubuntu 22.04: an older glibc keeps the AppImage/.deb/.rpm usable on more distributions
          - { os: ubuntu-22.04, name: linux-x64 }
          # free for public repositories; private repositories need larger runners
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          # .msi and setup .exe (NSIS); WebView2 comes with Windows 10/11 or is fetched by the installer
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    env:
      # linuxdeploy (AppImage) without FUSE on CI runners
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev patchelf rpm file

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: pnpm }
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cross-compilation target
        if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      # the UI tests run against the in-browser fake backend, the same on every system, so once is
      # enough; macOS WebKit is the closest to the app's own web view
      - if: matrix.name == 'macos-x64'
        run: pnpm exec playwright install --with-deps webkit
      - if: matrix.name == 'macos-x64'
        run: pnpm test:e2e
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Optional signing and notarization: only when the secrets exist. See docs/development.md, "Signing and notarization".
      - name: macOS signing environment
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "signing enabled"
          else
            echo "no certificate: building unsigned"
          fi
          if [ -n "$APPLE_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "notarization enabled"
          fi

      # builds the CLI sidecar first (beforeBuildCommand), then .app/.dmg or .deb/.rpm/AppImage
      - run: pnpm tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # the .pkg installer (app into /Applications, CLI into /usr/local/bin); signed when an
      # installer certificate is configured
      - name: macOS installer package
        if: runner.os == 'macOS'
        env:
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ -n "$APPLE_INSTALLER_CERTIFICATE" ]; then
            KC="$RUNNER_TEMP/installer.keychain-db"
            security create-keychain -p ci "$KC"
            security set-keychain-settings -lut 3600 "$KC"
            security unlock-keychain -p ci "$KC"
            echo "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -k "$KC" -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          else
            unset APPLE_INSTALLER_IDENTITY
          fi
          if [ -n "$TARGET" ]; then
            pnpm build:pkg --app "target/$TARGET/release/bundle/macos/$(jq -r .displayName branding/branding.json).app" --arch aarch64
          else
            pnpm build:pkg
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.name }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/*/release/bundle/dmg/*.dmg
            target/*/release/bundle/macos/*.app
            target/release/bundle/pkg/*.pkg
            target/release/bundle/macos/*.app
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
      # the command-line tool on its own (Linux: ship it next to the AppImage)
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: src-tauri/binaries/*

  # NixOS: the flake builds the app and CLI from source (also catches a stale pnpm hash)
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build -L .#default
      - run: nix flake check -L
      - name: The package has the app, the CLI and a desktop entry named after the app ID
        run: |
          ls result/bin
          ls result/share/applications
          ./result/bin/$(jq -r .cliCommand branding/branding.json) --version
