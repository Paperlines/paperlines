name: Release

# Actions → Release → Run workflow. Bumps the version everywhere, dates the "## Unreleased"
# section of docs/CHANGELOG.md, tags the commit, builds and signs every platform, and publishes a
# GitHub release with latest.json, which the app's updater reads. See .github/CONTRIBUTING.md.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch, minor, major, current (release the version as it is), an exact X.Y.Z, or rebuild (build the existing draft release again)"
        required: true
        default: patch

concurrency: release

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUMP: ${{ inputs.bump }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release from main"
          exit 1

      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - name: CI passed on this commit
        if: inputs.bump != 'rebuild'
        run: |
          conclusion=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push \
            --json conclusion --jq '.[0].conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI has not passed on $GITHUB_SHA (${conclusion:-no run yet}). Wait for it, or fix it first."
            exit 1
          fi

      - uses: actions/setup-node@v5
        if: inputs.bump != 'rebuild'
        # no pnpm in this job: setup-node's automatic pnpm cache would fail
        with: { node-version: 26, package-manager-cache: false }
      - name: Rust toolchain (checks Cargo.lock after the bump)
        if: inputs.bump != 'rebuild'
        run: rustup show

      - name: Set the version and date the changelog
        id: bump
        if: inputs.bump != 'rebuild'
        run: |
          version=$(node scripts/release.mjs next "$BUMP")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists"
            exit 1
          fi
          node scripts/release.mjs apply "$version" --notes "$RUNNER_TEMP/notes.md"
          cargo metadata --locked --format-version 1 >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        if: inputs.bump != 'rebuild'
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          # the release commit is credited to whoever started the release
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git commit -am "Release $TAG"
          git tag -a "$TAG" -m "Paperlines ${TAG#v}"
          git push origin HEAD:main "$TAG"

      - name: Draft release
        if: inputs.bump != 'rebuild'
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "Paperlines ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md"

      # rebuild: the version on main, which must already be tagged with a draft release
      - name: The release to build
        id: release
        run: |
          tag="v$(jq -r .version branding/branding.json)"
          # a fresh draft can take a few seconds to appear: try for up to a minute
          info=""
          for _ in $(seq 1 12); do
            info=$(gh release view "$tag" --json databaseId,isDraft 2>/dev/null) && break
            sleep 5
          done
          if [ -z "$info" ]; then
            echo "::error::There is no release $tag to build"
            exit 1
          fi
          if [ "$(jq -r .isDraft <<<"$info")" != "true" ]; then
            echo "::error::$tag is already published"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "id=$(jq -r .databaseId <<<"$info")" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # cross-compiled on the Intel image (see ci.yml)
          - { os: macos-15-intel, name: macos-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    name: build ${{ matrix.name }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.prepare.outputs.tag }}" }

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev patchelf rpm file

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: pnpm }
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cross-compilation target
        if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile

      # Optional signing and notarization: only when the secrets exist. See docs/development.md, "Signing and notarization".
      - name: macOS signing environment
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          fi

      # builds and uploads the bundles and their updater signatures (.sig) to the draft release
      - name: The draft release to upload to
        shell: bash
        run: |
          if [ -z "${{ needs.prepare.outputs.release_id }}" ]; then
            echo "::error::No release id from the prepare job: tauri-action would build without uploading"
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --config src-tauri/release.conf.json ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          # latest.json is written once, by the publish job, from every platform's signature
          includeUpdaterJson: false

      - name: Notarize the .dmg
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.target }}
        run: |
          [ -n "$APPLE_ID" ] || { echo "no notarization credentials: the .dmg stays as built"; exit 0; }
          for f in target/${TARGET:+$TARGET/}release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$f"
            gh release upload "$TAG" "$f" --clobber
          done

      - name: macOS installer package
        if: runner.os == 'macOS'
        env:
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ -n "$APPLE_INSTALLER_CERTIFICATE" ]; then
            KC="$RUNNER_TEMP/installer.keychain-db"
            security create-keychain -p ci "$KC"
            security set-keychain-settings -lut 3600 "$KC"
            security unlock-keychain -p ci "$KC"
            echo "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -k "$KC" -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          else
            unset APPLE_INSTALLER_IDENTITY
          fi
          if [ -n "$TARGET" ]; then
            pnpm build:pkg --app "target/$TARGET/release/bundle/macos/$(jq -r .displayName branding/branding.json).app" --arch aarch64
          else
            pnpm build:pkg
          fi
          gh release upload "$TAG" target/release/bundle/pkg/*.pkg --clobber

      # the command-line tool on its own (Linux: ship it next to the AppImage)
      - name: Command-line tool
        shell: bash
        run: gh release upload "$TAG" src-tauri/binaries/* --clobber

      # Windows code signing through SignPath Foundation (free for open source), only once the
      # repository variable SIGNPATH_ORGANIZATION_ID is set. See docs/development.md, "Windows signing".
      # The installers are replaced on the release by signed copies, and their updater signatures
      # (.sig) are made again, since the updater checks the file that is actually downloaded.
      - name: Windows files to sign
        id: unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            src-tauri/binaries/*.exe
          if-no-files-found: error
      - name: Sign with SignPath
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'paperlines' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # release signing waits for a project approver to click Approve on signpath.io
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed
      - name: Upload the signed Windows files
        if: steps.unsigned.outcome == 'success'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s globstar nullglob
          files=(signed/**/*.exe signed/**/*.msi)
          [ ${#files[@]} -gt 0 ] || { echo "::error::SignPath returned no files"; exit 1; }
          for f in "${files[@]}"; do
            case "$f" in *-setup.exe|*.msi)
              pnpm tauri signer sign "$f"
              gh release upload "$TAG" "$f" "$f.sig" --clobber ;;
            *)
              gh release upload "$TAG" "$f" --clobber ;;
            esac
          done

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with: { node-version: 26, package-manager-cache: false }
      # the browser extension, under the same name every release so the app's "Download" link
      # (releases/latest/download/…) always gets the current one
      - name: Browser extension
        run: |
          (cd extension && zip -qr "$RUNNER_TEMP/paperlines-browser-extension.zip" . -x "*.test.*")
          gh release upload "${{ needs.prepare.outputs.tag }}" "$RUNNER_TEMP/paperlines-browser-extension.zip" --clobber
      - name: latest.json, release notes with contributors, publish
        run: node scripts/release.mjs publish "${{ needs.prepare.outputs.tag }}"
