# Checks the winget manifest in packaging/winget on a real Windows machine: validate, install, uninstall.
# The same manifest goes to microsoft/winget-pkgs (manifests/p/Paperlines/Paperlines/<version>).
name: winget

on:
  workflow_dispatch:
  pull_request:
    paths: ["packaging/winget/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: winget version
        run: winget --version
      - name: Validate
        run: winget validate --manifest packaging/winget
      - name: WebView2 on this machine
        shell: pwsh
        run: |
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          foreach ($k in $keys) { if (Test-Path $k) { "${k} -> $((Get-ItemProperty $k).pv)" } else { "${k}: missing" } }
      - name: Run the installer silently and watch it
        shell: pwsh
        run: |
          $url = (Select-String -Path packaging/winget/Paperlines.Paperlines.installer.yaml -Pattern 'InstallerUrl: (.+)').Matches[0].Groups[1].Value.Trim()
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\setup.exe"
          $p = Start-Process "$env:RUNNER_TEMP\setup.exe" -ArgumentList '/S' -PassThru
          for ($i = 0; $i -lt 24; $i++) {
            Start-Sleep 5
            $procs = Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'setup|paperlines|webview|msiexec|Au_' } | ForEach-Object { "$($_.Name)[$($_.ProcessId) <- $($_.ParentProcessId)]" }
            $files = (Get-ChildItem "$env:LOCALAPPDATA\Paperlines" -ErrorAction SilentlyContinue | ForEach-Object Name) -join ','
            "t=$(($i+1)*5)s exited=$($p.HasExited) procs=$($procs -join ' ') files=$files"
            if ($p.HasExited) { "exit code $($p.ExitCode)"; break }
          }
          if (-not $p.HasExited) { Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $p.Id } | Format-Table Name, ProcessId, CommandLine -AutoSize | Out-String -Width 300; Stop-Process -Id $p.Id -Force; Get-Process paperlines* -ErrorAction SilentlyContinue | Stop-Process -Force }
          Get-ChildItem "$env:LOCALAPPDATA\Paperlines" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 20 FullName
      - name: Same installer, marked as downloaded from the internet
        shell: pwsh
        run: |
          & "$env:LOCALAPPDATA\Paperlines\uninstall.exe" /S; Start-Sleep 5
          Set-Content -Path "$env:RUNNER_TEMP\setup.exe" -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          Get-Content "$env:RUNNER_TEMP\setup.exe" -Stream Zone.Identifier
          $p = Start-Process "$env:RUNNER_TEMP\setup.exe" -ArgumentList '/S' -PassThru
          for ($i = 0; $i -lt 12; $i++) {
            Start-Sleep 5
            $procs = Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'setup|paperlines|smartscreen|consent|Au_' } | ForEach-Object { "$($_.Name)[$($_.ProcessId) <- $($_.ParentProcessId)]" }
            "t=$(($i+1)*5)s exited=$($p.HasExited) procs=$($procs -join ' ')"
            if ($p.HasExited) { "exit code $($p.ExitCode)"; break }
          }
          if (-not $p.HasExited) { "STILL RUNNING: the internet mark makes it wait"; Stop-Process -Id $p.Id -Force }
      - name: Install from the manifest
        timeout-minutes: 8
        run: |
          winget settings --enable LocalManifestFiles
          winget install --manifest packaging/winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
      - name: Processes and winget logs (if the install failed or hung)
        if: failure() || cancelled()
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -match 'paperlines|setup|webview|msedge|nsis|Au_' } | Format-Table ProcessName, Id, StartTime -AutoSize | Out-String -Width 200
          $dir = "$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir"
          Get-ChildItem $dir -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1 | ForEach-Object { Get-Content $_.FullName -Tail 60 }
      - name: Installed
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Paperlines" -Recurse -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 5
          if (-not $exe) { throw "Paperlines was not installed under %LOCALAPPDATA%\Paperlines" }
          $exe | ForEach-Object { $_.FullName }
          winget list --name Paperlines --disable-interactivity
      - name: Uninstall
        run: winget uninstall --name Paperlines --silent --disable-interactivity
